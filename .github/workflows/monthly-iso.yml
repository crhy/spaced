name: Monthly ISO build and desktop smoke test

on:
  workflow_dispatch:
  schedule:
    - cron: "23 9 1 * *"

permissions:
  contents: read

concurrency:
  group: monthly-iso-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Check out the distribution
        uses: actions/checkout@v4

      - name: Install build and VM dependencies
        run: make deps

      - name: Install the pinned current live-build toolchain
        shell: bash
        run: |
          package="$RUNNER_TEMP/live-build_20250814_all.deb"
          curl --fail --location --show-error \
            --proto '=https' --proto-redir '=https' \
            --retry 3 --retry-all-errors --connect-timeout 15 \
            --output "$package" \
            https://deb.debian.org/debian/pool/main/l/live-build/live-build_20250814_all.deb
          echo "a4bffb8e6436ffba260f2e1c37be9dd04a4dacf52c38d7bbe454ec826ba52a4b  $package" \
            | sha256sum --check --strict
          sudo dpkg --install "$package"
          test "$(dpkg-query -W -f='${Version}' live-build)" = '1:20250814'

      - name: Enable isolated user namespaces on this disposable runner
        run: |
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Validate release source
        run: make check

      - name: Select available QEMU acceleration
        shell: bash
        run: |
          if [[ -c /dev/kvm ]]; then
            sudo chmod a+rw /dev/kvm
            echo "SPACED_QEMU_ACCEL=kvm" >> "$GITHUB_ENV"
            echo "SPACED_ISO_SMOKE_TIMEOUT=360" >> "$GITHUB_ENV"
          else
            echo "SPACED_QEMU_ACCEL=tcg" >> "$GITHUB_ENV"
            echo "SPACED_ISO_SMOKE_TIMEOUT=900" >> "$GITHUB_ENV"
          fi

      - name: Clean-build the ISO
        shell: bash
        run: |
          make release
          iso=$(find build/iso -maxdepth 1 -type f -name '*.iso' -print -quit)
          size=$(stat -c '%s' "$iso")
          if (( size >= 2147483648 )); then
            echo "ISO is $size bytes; GitHub release assets must be under 2 GiB" >&2
            exit 1
          fi

      - name: Boot through SSH into the MATE and Compiz desktop
        run: make iso-smoke-kvm

      - name: Validate UEFI boot and desktop
        run: make iso-smoke-kvm-efi

      - name: Validate a 4K virtual desktop
        run: make iso-smoke-kvm-4k

      - name: Upload ISO, checksum, and desktop evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spaced-linux-monthly-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            build/iso/*.iso
            build/iso/*.sha256
            build/test-artifacts/*
