# Cross-OS benchmark matrix: one "<label> <iso-path>" line per operating system,
# read by scripts/vm/bench/run-bench.sh. Spaced's own ISO is listed first so the
# comparison always has the subject of the issue on the left.
#
# Blank lines and lines starting with # are ignored. A path may be absolute or
# relative to the repository root, and {VERSION} expands to the contents of the
# repo's VERSION file. An entry whose ISO is not on this machine prints
# "SKIP: <label> no iso at <path>" and the run continues.
#
# The distro ISO matrix for issue #424 is NOT fetched or installed by anything
# in this repository: each ISO has to be downloaded and verified by hand, then
# its path added below. Only the Spaced line below can be measured on a machine
# that has just built an ISO.

spaced-linux build/iso/spaced-linux-{VERSION}-amd64.iso

# Later, once an image has been fetched and verified by hand, add it here:
# debian build/iso/bench/debian-13-amd64.iso
# ubuntu build/iso/bench/ubuntu-24.04-amd64.iso
# fedora build/iso/bench/fedora-41-amd64.iso
# opensuse build/iso/bench/opensuse-15.6-amd64.iso
# alpine build/iso/bench/alpine-3.21-amd64.iso
