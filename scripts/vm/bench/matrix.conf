# Cross-OS benchmark matrix: one "<label> <iso-path> [options]" line per
# operating system, read by scripts/vm/bench/run-bench.sh. Spaced's own ISO is
# listed first so the comparison always has the subject of the issue on the
# left.
#
# Blank lines and lines starting with # are ignored. A path may be absolute or
# relative to the repository root, and {VERSION} expands to the contents of the
# repo's VERSION file. Options are key=value pairs:
#   distro=     the package manager family guest-pts.sh installs from
#   version=    the release the ISO file carries
#   desktop=    what the live session boots (spaces written as +)
#   access=     ssh (the ISO answers root SSH on the forwarded port) or qmp
#               (the runner types one command into the live desktop's terminal)
#   terminal=   how to open that terminal over QMP: a shortcut, optionally
#               shortcut+command for a run dialog; recipes separated by ;
#   rootcmd=    how guest-pts.sh gets root inside the guest (sudo -n, none)
#   fetch=      wget | curl | python3, the tool the typed bootstrap uses
# An entry whose ISO is not on this machine prints
# "SKIP: <label> no iso at <path>" and the run continues.
#
# The ISOs below are the most popular desktop distributions plus the two
# systemd-free ones #424's thread asked about (Void and MX). They are
# downloaded and SHA-256 verified by hand under /media/rhy/data/bench-isos/
# and NEVER by this repository; docs/VM-BENCHMARKS.md lists the official
# sources. Each gets a fresh 40G qcow2 disk under /media/rhy/data/bench-vms/,
# destroyed when that OS is done.

spaced-linux /media/rhy/data/bench-isos/spaced-linux-{VERSION}-amd64.iso distro=spaced version={VERSION} desktop=MATE+Compiz access=ssh rootcmd=none fetch=wget
debian /media/rhy/data/bench-isos/debian-live-13.8.0-amd64-mate.iso distro=debian version=13.8 desktop=MATE+Compiz-live access=qmp terminal=ctrl-alt-t;alt-f2+mate-terminal rootcmd=sudo+-n fetch=wget
linuxmint /media/rhy/data/bench-isos/linuxmint-22.3-mate-64bit.iso distro=mint version=22.3 desktop=MATE-live access=qmp terminal=ctrl-alt-t;alt-f2+mate-terminal rootcmd=sudo+-n fetch=wget
fedora /media/rhy/data/bench-isos/Fedora-MATE_Compiz-Live-45-1.4.x86_64.iso distro=fedora version=45 desktop=MATE+Compiz-live access=qmp terminal=ctrl-alt-t;alt-f2+xterm rootcmd=sudo+-n fetch=curl
ubuntu /media/rhy/data/bench-isos/ubuntu-26.04.1-desktop-amd64.iso distro=ubuntu version=26.04 desktop=GNOME-live access=qmp terminal=ctrl-alt-t rootcmd=sudo+-n fetch=wget
zorin /media/rhy/data/bench-isos/Zorin-OS-18.1-Core-64-bit.iso distro=zorin version=18.1 desktop=Cinnamon-live access=qmp terminal=ctrl-alt-t rootcmd=sudo+-n fetch=wget
cachyos /media/rhy/data/bench-isos/cachyos-desktop-linux-260809.iso distro=cachyos version=260809 desktop=KDE-live access=qmp terminal=ctrl-alt-t;alt-f2+konsole rootcmd=sudo+-n fetch=curl
void /media/rhy/data/bench-isos/void-live-x86_64-20250202-xfce.iso distro=void version=20250202 desktop=XFCE-live+sysvinit access=qmp terminal=ctrl-alt-t rootcmd=none fetch=wget
mx /media/rhy/data/bench-isos/MX-25.3_Xfce_x64.iso distro=mx version=25.3 desktop=XFCE-live+sysvinit access=qmp terminal=ctrl-alt-t rootcmd=sudo+-n fetch=wget
