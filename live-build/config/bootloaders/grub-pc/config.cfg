set default=0

insmod all_video

if [ x$feature_default_font_path = xy ] ; then
    font=unicode
else
    font=$prefix/fonts/unicode.pf2
fi

loadfont $font

set gfxmode=1920x1080,1024x768,800x600,auto
set gfxpayload=keep

insmod gfxterm
insmod png

source /boot/grub/theme.cfg
terminal_output gfxterm

insmod play
play 960 440 1 0 4 440 1
