# Spaced Linux 8.26.1 Desktop Configuration

theme:
  gtk: Spaced-Linux-Dark
  metacity: Spaced-Linux-Dark
  icons: Spaced-Icons-Linux-Dark

background:
  filename: /usr/share/backgrounds/spaced/SpacedBack.jpg
  options: zoom
  draw_background: true
  show_desktop_icons: true

panel:
  layout: spaced-linux
  position: bottom
  applets:
    - mate-applet-brisk-menu
    - window-list
    - notification-area
    - volume-control-applet
    - clock
    - show-desktop

clock:
  format: 12-hour
  show_date: false
  show_weather: false
  temperature_unit: fahrenheit
  speed_unit: mph

lightdm:
  greeter: lightdm-gtk-greeter
  autologin: user
  autologin_timeout: 0
  background: /usr/share/backgrounds/spaced/SimpleBackc.png
  theme: Spaced-Dark
  icons: Spaced-Icons-Linux-Dark
  logo: /usr/share/pixmaps/spaced-logo.png

session:
  desktop: mate-session
  window_manager: compiz

wallpaper:
  method: caja
  fallback: feh
