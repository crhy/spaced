# Reviewed PDF viewer capability table (issue #304).
#
# One record per candidate. The packaging keys are facts to resolve; the seven
# capability axes are the review's own list and stay "unknown" until
# scripts/pdf-capability-matrix.py prints a source for them. scripts/check.sh
# refuses a shipped default that this table does not agree with, and
# scripts/pdf-capability-matrix.py --check refuses any axis value that the
# machine's own metadata does not back with a printed source.
#
# Allowed axis values: unknown, no-evidence, not-packaged, evidence.
