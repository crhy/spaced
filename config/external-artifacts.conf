# Pinned inputs for independently released Spaced Linux components.
#
# This file is sourced by scripts/iso/stage-external-artifacts.sh. Environment
# values take precedence so a verified local artifact can be used while the
# standalone repositories are developed. Production release builds must
# replace every UNRELEASED value with a release tag, SHA-256, or fingerprint.

: "${SPACED_WELCOME_REPOSITORY:=crhy/spacedwelcome}"
: "${SPACED_WELCOME_VERSION:=0.1.6}"
: "${SPACED_WELCOME_RELEASE_TAG:=v0.1.6}"
: "${SPACED_WELCOME_SHA256:=adbc1bd317552964f93553f729f40b23e62573579812766aeca2f93a399d2b6d}"

: "${SPACED_BAZAAR_REPOSITORY:=crhy/spacedbazaar}"
: "${SPACED_BAZAAR_VERSION:=0.1.5}"
: "${SPACED_BAZAAR_RELEASE_TAG:=0.1.5}"
: "${SPACED_BAZAAR_SHA256_AMD64:=7814d6ce565ad35b7ee47c51555b38468d2035c3c75d96f72aafe820c27bc9b7}"
: "${SPACED_BAZAAR_SHA256_ARM64:=UNRELEASED}"

# The descriptor carries the public key for the signed OSTree repository. Its
# canonical URL is stable; the checksum and primary-key fingerprint pin the
# exact definition used for an ISO build.
: "${SPACED_GITHUB_REMOTE_NAME:=spaced-github}"
: "${SPACED_GITHUB_REMOTE_DESCRIPTOR_URL:=https://crhy.github.io/spacedbazaar/spaced-github.flatpakrepo}"
: "${SPACED_GITHUB_REPO_URL:=https://crhy.github.io/spacedbazaar/flatpak-repo/}"
: "${SPACED_GITHUB_REMOTE_SHA256:=28f97e41bf65ac44924bffd6b7772d4e77ebce504d4bfa1620998665ae3a2215}"
: "${SPACED_GITHUB_GPG_FINGERPRINT:=6C16F77C2DAE19D262CFD9F0CC05F885576EBB05}"
