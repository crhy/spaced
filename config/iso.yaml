# Spaced Linux 9.26 ISO Configuration
iso_name: spaced-linux-9.26
version: "9.26"
arch: amd64

# Package sources
apt:
  mirror: "http://deb.devuan.org/merged"
  components: [main, contrib, non-free, non-free-firmware]
  suite: ceres

# Distribution
dist: Devuan
suite: ceres

# Boot options
boot:
  timeout: 5
  background: "/usr/share/backgrounds/spaced/SimpleBackb.png"

# Live user
live_user: user
live_password: "1"
root_password: "spaced"

# Installer
installer: calamares
