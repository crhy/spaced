[core]
as_active_plugins = core;ccp;clone;commands;decoration;fade;glib;matecompat;minimize;mousepoll;move;neg;obs;place;png;regex;resize;screenshot;snap;svg;workarounds;cube;3d;expo;focuspoll;rotate;scale;ezoom;switcher;
as_show_desktop_key = <Control><Alt>d
s0_hsize = 4
s0_vsize = 1

[decoration]
as_command = gtk-window-decorator --replace

[cube]
s0_images =
s0_color = #000000ff
s0_skydome = true
s0_skydome_gradient_start_color = #000000ff
s0_skydome_gradient_end_color = #00194aff
s0_speed = 3.000000

[3d]
s0_width = 0.100000
s0_bevel = 0.000000
s0_min_cube_size = 3

[rotate]
s0_speed = 4.000000
s0_zoom = 0.300000

[expo]
as_expo_edge = TopLeft

[ezoom]
as_zoom_in_button = <Shift><Super>Button4
as_zoom_out_button = <Shift><Super>Button5
as_zoom_in_key = <Shift><Super>Up
as_zoom_out_key = <Shift><Super>Down

[matecompat]
as_run_key = <Alt>F2
as_command_terminal = mate-terminal
as_run_command_terminal_key = <Control><Alt>t

[move]
as_initiate_button = <Alt>Button1

[resize]
as_initiate_button = <Super>Button3

[place]
s0_mode = 0

[mousepoll]
as_mouse_poll_interval = 100

[scale]
as_initiate_edge =
as_initiate_all_edge =
as_initiate_group_edge =
as_initiate_output_edge =

[wobbly]
s0_friction = 5.000000

[animation]
s0_open_effects = animation:Random;animation:Random;animation:Random;
s0_open_random_effects = animation:Curved Fold;animation:Horizontal Folds;animation:Dream;animation:Fade;animation:Glide 1;animation:Glide 2;animation:Magic Lamp;animation:Sidekick;animation:Vacuum;animation:Wave;animation:Zoom;
s0_close_effects = animation:Random;animation:Random;animation:Random;
s0_close_random_effects = animation:Curved Fold;animation:Horizontal Folds;animation:Dream;animation:Fade;animation:Glide 1;animation:Glide 2;animation:Magic Lamp;animation:Sidekick;animation:Vacuum;animation:Wave;animation:Zoom;
s0_minimize_effects = animation:Random;
s0_minimize_random_effects = animation:Curved Fold;animation:Horizontal Folds;animation:Dream;animation:Fade;animation:Glide 1;animation:Glide 2;animation:Magic Lamp;animation:Sidekick;animation:Zoom;
