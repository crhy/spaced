---
dontChroot: false
timeout: 30
verbose: true

i18n:
  name: "Removing the live session account"

# The unpacked live image still contains the live account "user" with UID and
# GID 1000. Remove it before the users module runs so the installed user gets
# 1000 (issue #227). This also covers an installed user named "user", who is
# then created fresh from /etc/skel.
script:
  - "if id user >/dev/null 2>&1; then userdel -r user; fi"
  - "if getent group user >/dev/null 2>&1; then groupdel user; fi"
