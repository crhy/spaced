---
dontChroot: false
timeout: 120
verbose: true

i18n:
  name: "Finalizing Spaced Linux"

# These commands run inside the installed target after the user account has
# been made. Use home-directory globs as well as Calamares' USER expansion so
# cleanup remains correct across Calamares versions.
script:
  - "rm -f /etc/sudoers.d/spaced-live /etc/polkit-1/rules.d/49-spaced-live-gparted.rules /etc/lightdm/lightdm.conf.d/50-spaced.conf /etc/ssh/sshd_config.d/10-spaced.conf"
  - "rm -f /etc/xdg/autostart/spaced-live-session.desktop"
  - "rm -f /etc/skel/Desktop/install-spaced-linux.desktop /home/*/Desktop/install-spaced-linux.desktop"
  - "rm -f /usr/share/spaced-themes/cairo-dock/launchers/04-install.desktop /etc/skel/.config/cairo-dock/current_theme/launchers/04-install.desktop /home/*/.config/cairo-dock/current_theme/launchers/04-install.desktop"
  - "rm -f /usr/local/bin/install-spaced-linux"
  - "install -d -m 0755 /var/lib/spaced-linux/first-boot-snapshot && touch /var/lib/spaced-linux/first-boot-snapshot/pending"
  - "test ! -x /usr/bin/calamares"
  - "if [ 'USER' != 'user' ] && id user >/dev/null 2>&1; then userdel -r user; fi"
  - "passwd -l root"
  - "sed -i '/^S0:.*ttyS0/d' /etc/inittab 2>/dev/null || true"
  - "update-rc.d ssh disable 2>/dev/null || true"
