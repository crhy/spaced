---
backend: apt

# The live image carries debugging and installation tools that should not be
# left behind on the lean installed system.
# The rescue tools stay on the live USB: an installed system never gets them.
operations:
  - remove:
      - live-boot
      - live-config
      - live-config-sysvinit
      - openssh-server
      - calamares
      - calamares-settings-debian
      - squashfs-tools
      - gddrescue
      - exfatprogs
      - lvm2
      - smartmontools
      - testdisk
      - photorec
      - gparted
