---
userGroup: users
# A group missing from the target would be created with an ordinary GID and
# push the first user's own group past 1000 (issue #227).
defaultGroups:
  - cdrom
  - floppy
  - sudo
  - audio
  - dip
  - video
  - plugdev
  - name: netdev
    must_exist: false
    system: true
  - name: lpadmin
    must_exist: false
    system: true
  - name: scanner
    must_exist: false
    system: true
  - name: bluetooth
    must_exist: false
    system: true
autologinGroup: autologin
sudoersGroup: sudo
setRootPassword: false

passwordRequirements:
  # Allow any non-empty password, including a single digit. Calamares still
  # requires confirmation so accidental typos are caught.
  minLength: 1
  maxLength: -1
