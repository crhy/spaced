---
userGroup: users
defaultGroups:
  - cdrom
  - floppy
  - sudo
  - audio
  - dip
  - video
  - plugdev
  - netdev
  - lpadmin
  - scanner
  - bluetooth
autologinGroup: autologin
sudoersGroup: sudo
setRootPassword: false

passwordRequirements:
  # Allow any non-empty password, including a single digit. Calamares still
  # requires confirmation so accidental typos are caught.
  minLength: 1
  maxLength: -1
