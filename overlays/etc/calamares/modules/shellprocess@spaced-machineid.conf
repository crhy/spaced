---
dontChroot: false
timeout: 10
verbose: true

i18n:
  name: "Generating machine identity"

# Spaced Linux uses sysvinit. Generate the D-Bus machine ID directly instead
# of invoking a systemd helper, then expose the conventional
# /etc/machine-id path as a symlink for desktop applications.
script:
  - "mkdir -p /var/lib/dbus"
  - "rm -f /var/lib/dbus/machine-id /etc/machine-id"
  - "dbus-uuidgen --ensure=/var/lib/dbus/machine-id"
  - "ln -s /var/lib/dbus/machine-id /etc/machine-id"
