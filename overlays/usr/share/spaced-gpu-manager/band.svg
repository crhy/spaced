<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 72">
  <!-- Faint space art for the header band: a planet edge glowing blue with
       stars, fading into the band colour toward the left. One static image;
       everything is semi-transparent so any band colour shows through. -->
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.7" stop-color="#1e9be0" stop-opacity="0"/>
      <stop offset="0.86" stop-color="#1e9be0" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#1e9be0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="limb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#123a5e" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#0a1626" stop-opacity="0.75"/>
    </linearGradient>
  </defs>
  <circle cx="360" cy="140" r="95" fill="url(#limb)"/>
  <circle cx="360" cy="140" r="95" fill="url(#glow)"/>
  <g fill="#cfe6fa">
    <circle cx="180" cy="16" r="0.8" opacity="0.25"/><circle cx="214" cy="30" r="0.8" opacity="0.35"/>
    <circle cx="252" cy="10" r="1.2" opacity="0.5"/><circle cx="286" cy="26" r="0.7" opacity="0.45"/>
    <circle cx="318" cy="8" r="1.0" opacity="0.6"/><circle cx="238" cy="50" r="0.7" opacity="0.4"/>
    <circle cx="276" cy="44" r="0.9" opacity="0.5"/><circle cx="308" cy="54" r="0.8" opacity="0.55"/>
    <circle cx="352" cy="34" r="0.8" opacity="0.6"/><circle cx="396" cy="18" r="1.1" opacity="0.65"/>
  </g>
</svg>
